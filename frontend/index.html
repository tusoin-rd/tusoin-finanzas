<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TuSoinRD — Control Financiero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: '#1d4ed8' } } }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans">

  <!-- Navbar -->
  <nav class="bg-blue-700 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <span class="text-xl font-bold tracking-wide">💼 TuSoinRD</span>
      <div class="flex gap-4 text-sm font-medium">
        <a href="index.html"            class="hover:text-blue-200 underline">Dashboard</a>
        <a href="pages/clientes.html"   class="hover:text-blue-200">Clientes</a>
        <a href="pages/ingresos.html"   class="hover:text-blue-200">Ingresos</a>
        <a href="pages/egresos.html"    class="hover:text-blue-200">Egresos</a>
        <a href="pages/reportes.html"   class="hover:text-blue-200">Reportes</a>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">📊 Dashboard</h1>

    <!-- Filtros de fecha -->
    <div class="flex flex-wrap gap-3 mb-6 items-end">
      <div>
        <label class="text-xs text-gray-500 block mb-1">Desde</label>
        <input type="date" id="fechaDesde" class="border rounded px-3 py-1.5 text-sm"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 block mb-1">Hasta</label>
        <input type="date" id="fechaHasta" class="border rounded px-3 py-1.5 text-sm"/>
      </div>
      <button onclick="cargarResumen()" class="bg-blue-700 text-white px-4 py-1.5 rounded text-sm hover:bg-blue-800">
        Filtrar
      </button>
      <button onclick="limpiarFiltros()" class="border px-4 py-1.5 rounded text-sm hover:bg-gray-100">
        Limpiar
      </button>
    </div>

    <!-- Tarjetas KPI -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow p-5 border-l-4 border-green-500">
        <p class="text-xs text-gray-500 uppercase font-semibold">Total Ingresos</p>
        <p class="text-2xl font-bold text-green-600 mt-1" id="totalIngresos">—</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5 border-l-4 border-red-500">
        <p class="text-xs text-gray-500 uppercase font-semibold">Total Egresos</p>
        <p class="text-2xl font-bold text-red-500 mt-1" id="totalEgresos">—</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5 border-l-4 border-blue-500">
        <p class="text-xs text-gray-500 uppercase font-semibold">Balance Neto</p>
        <p class="text-2xl font-bold text-blue-700 mt-1" id="balance">—</p>
      </div>
      <div class="bg-white rounded-xl shadow p-5 border-l-4 border-purple-500">
        <p class="text-xs text-gray-500 uppercase font-semibold">Clientes Activos</p>
        <p class="text-2xl font-bold text-purple-700 mt-1" id="totalClientes">—</p>
      </div>
    </div>

    <!-- Gráfica + Top Clientes -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Gráfica de barras -->
      <div class="lg:col-span-2 bg-white rounded-xl shadow p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-semibold text-gray-700">Ingresos vs Egresos por Mes</h2>
          <select id="anioSelect" onchange="cargarGrafica()" class="border rounded px-2 py-1 text-sm">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
          </select>
        </div>
        <canvas id="graficaMensual" height="120"></canvas>
      </div>

      <!-- Top Clientes -->
      <div class="bg-white rounded-xl shadow p-5">
        <h2 class="font-semibold text-gray-700 mb-4">🏆 Top 5 Clientes</h2>
        <ul id="topClientes" class="space-y-2 text-sm text-gray-600">
          <li class="text-gray-400">Cargando...</li>
        </ul>
      </div>
    </div>

    <!-- Accesos rápidos -->
    <div class="mt-8 grid grid-cols-2 sm:grid-cols-4 gap-4">
      <a href="pages/ingresos.html"
         class="bg-green-600 text-white text-center py-3 rounded-xl font-medium hover:bg-green-700 transition">
        ➕ Nuevo Ingreso
      </a>
      <a href="pages/egresos.html"
         class="bg-red-500 text-white text-center py-3 rounded-xl font-medium hover:bg-red-600 transition">
        ➖ Nuevo Egreso
      </a>
      <a href="pages/clientes.html"
         class="bg-purple-600 text-white text-center py-3 rounded-xl font-medium hover:bg-purple-700 transition">
        👤 Nuevo Cliente
      </a>
      <a href="pages/reportes.html"
         class="bg-blue-600 text-white text-center py-3 rounded-xl font-medium hover:bg-blue-700 transition">
        📈 Ver Reportes
      </a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const fmt = (n) => new Intl.NumberFormat('es-DO', {
      style: 'currency', currency: 'DOP', maximumFractionDigits: 0
    }).format(n);

    let graficaInstance = null;

    async function cargarResumen() {
      const desde = document.getElementById('fechaDesde').value;
      const hasta = document.getElementById('fechaHasta').value;
      const params = new URLSearchParams();
      if (desde) params.append('fecha_desde', desde);
      if (hasta) params.append('fecha_hasta', hasta);

      try {
        const data = await apiGet(`/reportes/resumen?${params}`);
        document.getElementById('totalIngresos').textContent = fmt(data.total_ingresos);
        document.getElementById('totalEgresos').textContent  = fmt(data.total_egresos);
        document.getElementById('balance').textContent       = fmt(data.balance);
        document.getElementById('totalClientes').textContent = data.total_clientes;

        const balanceEl = document.getElementById('balance');
        balanceEl.className = `text-2xl font-bold mt-1 ${data.balance >= 0 ? 'text-blue-700' : 'text-red-600'}`;
      } catch(e) {
        console.error('Error cargando resumen:', e);
      }
    }

    async function cargarGrafica() {
      const anio = document.getElementById('anioSelect').value;
      try {
        const data = await apiGet(`/reportes/por-mes?anio=${anio}`);
        const ctx = document.getElementById('graficaMensual').getContext('2d');
        if (graficaInstance) graficaInstance.destroy();
        graficaInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: data.labels,
            datasets: [
              { label: 'Ingresos', data: data.ingresos, backgroundColor: '#22c55e' },
              { label: 'Egresos',  data: data.egresos,  backgroundColor: '#ef4444' },
            ]
          },
          options: {
            responsive: true,
            plugins: { legend: { position: 'top' } },
            scales: { y: { beginAtZero: true } }
          }
        });
      } catch(e) { console.error('Error cargando gráfica:', e); }
    }

    async function cargarTopClientes() {
      try {
        const data = await apiGet('/reportes/top-clientes?limite=5');
        const ul = document.getElementById('topClientes');
        if (!data.length) {
          ul.innerHTML = '<li class="text-gray-400">Sin datos aún</li>';
          return;
        }
        ul.innerHTML = data.map((c, i) => `
          <li class="flex justify-between">
            <span>${i+1}. ${c.cliente}</span>
            <span class="font-semibold text-green-600">${fmt(c.total)}</span>
          </li>
        `).join('');
      } catch(e) { console.error('Error cargando top clientes:', e); }
    }

    function limpiarFiltros() {
      document.getElementById('fechaDesde').value = '';
      document.getElementById('fechaHasta').value = '';
      cargarResumen();
    }

    // Inicializar dashboard
    cargarResumen();
    cargarGrafica();
    cargarTopClientes();
  </script>
</body>
</html>
